[alias]
xtask = "run --package xtask --"

# No `[build] rustflags` entry is defined on purpose.
#
# Cargo discovers this file from the current working directory, so
# `build.rustflags` applies to every crate compiled from anywhere inside the
# repository: third-party dependencies, out-of-workspace manifests, and
# `cargo install` builds. Under a repository-wide `-D warnings`, the
# `cargo install cargo-deny` step in docs/quality/dependency-policy.md compiled
# its entire dependency tree with warnings escalated to errors, so one new
# upstream warning -- from an added dependency or a new rustc lint -- would fail
# an unrelated job.
#
# Lint policy therefore lives in `[workspace.lints]` in `Cargo.toml`, which
# Cargo applies to workspace members only, and `cargo xtask ci` escalates the
# remaining warnings to errors for workspace code through
# `cargo clippy ... -- -D warnings`.
