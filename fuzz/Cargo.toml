[package]
name = "partman-fuzz"
description = "Fuzz targets for PartMan parsers (Section 11.4)"
version = "0.0.0"
edition = "2024"
# Spelled out rather than inherited: this crate is excluded from the workspace
# (below), so `license.workspace = true` has no workspace to read. It must be
# updated by hand if the project ever relicenses.
license = "MIT OR Apache-2.0"
publish = false

# Excluded from the workspace on purpose. These targets need a nightly
# toolchain for libFuzzer, and the workspace is pinned to one stable release in
# rust-toolchain.toml. Keeping them out means `cargo xtask ci` never attempts to
# build them on stable. See docs/quality/fuzzing.md.

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = "1"
partman-domain = { path = "../crates/domain" }
partman-cli = { path = "../apps/cli" }
partman-table-parser = { path = "../crates/table-parser" }

[[bin]]
name = "decode_is_canonical"
path = "fuzz_targets/decode_is_canonical.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip_value"
path = "fuzz_targets/roundtrip_value.rs"
test = false
doc = false
bench = false

[[bin]]
name = "plist_bounds_hold"
path = "fuzz_targets/plist_bounds_hold.rs"
test = false
doc = false
bench = false

[[bin]]
name = "table_claims_never_vanish"
path = "fuzz_targets/table_claims_never_vanish.rs"
test = false
doc = false
bench = false

[profile.release]
debug = true
