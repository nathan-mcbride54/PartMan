[package]
name = "partman-cli"
description = "The WP-035 read-only CLI chassis: structured argv, a documented exit-code contract, a schema-versioned JSON envelope, and a typed refusal vocabulary"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "partman"
path = "src/main.rs"

# Exactly one shipped dependency, and that exactness is a guard rather
# than a convenience: `the_shipped_dependency_closure_is_exactly_the_launcher`
# asserts through `cargo metadata` that the closure is `partman-launcher`
# alone and that the launcher crate itself depends on nothing, so no hash
# or plan implementation can arrive from outside this crate — transitively.
# The widening was a reviewed decision (the launcher-home round, option A,
# docs/reviews/LINUX_LAUNCHER_HOME_ROUND_2026-08-20.md, with the found
# closure cost put to the decision owner 2026-08-20): the SAFE-004 launch
# mechanism moved to its own crate so the privileged helper can share it,
# and the CLI follows it there. What the guard cannot see — std's own
# hashers used deliberately in-crate — is held off the output type by its
# Tier-1 ambiguity assertion, and past that is a named review obligation,
# not a claimed impossibility. Widening further is a reviewed decision,
# not a convenience.
[dependencies]
partman-launcher = { path = "../../crates/launcher" }

[dev-dependencies]
# Test-only, for parsing `cargo metadata` in the structural guard — a
# hand-rolled scan of that JSON would be the fourth text scanner this
# repository watched get defeated. Already in the workspace lock through
# `partman-tokens`, so this adds an edge, not new supply-chain surface, and a
# dev-dependency cannot reach the shipped binary; the guard test states which
# dependency kinds it excludes and why.
serde_json = "1.0"
# Test-only, for the increment-4 replay goldens: the assignment's words are
# "fixture-backed replay over WP-020's deterministic images", and this is
# that crate — a single catalogue image is synthesized in memory, written to
# a test-owned temporary file, and replayed. Dev-only, so the shipped
# closure stays empty and the guard test keeps proving it.
partman-fixtures = { path = "../../crates/fixtures" }

[lints]
workspace = true
