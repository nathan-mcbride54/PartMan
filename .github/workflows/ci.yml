name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Weekly, so the legs that do not run on every pull request still run against
  # unchanged code on a known cadence.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The two platforms every pull request is gated on. Windows is the primary
  # target and Linux is where the prober work lives.
  tier-1:
    name: Tier 1 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the unprivileged Tier-1 gate
        run: cargo xtask ci

  # macOS is billed at **ten times** wall-clock on a private repository, against
  # Linux at one and Windows at two. The 45-second macOS leg was therefore the
  # single most expensive job here — dearer than the eight-minute supply-chain
  # scan — and it ran on every push to every branch.
  #
  # It is a separate job rather than a third matrix entry because a matrix
  # cannot be filtered by event without a computed `fromJSON` expression, and
  # plain YAML that cannot misparse is worth six duplicated lines.
  #
  # The trade is named rather than buried: a macOS-only regression is now caught
  # at merge instead of before it. That is acceptable *for now* only because
  # there is no macOS implementation to regress — `docs/quality/observability.md`
  # records the platform as "not established" — and it must be revisited when
  # MAC-00x work begins.
  tier-1-macos:
    name: Tier 1 / macos-15
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the unprivileged Tier-1 gate
        run: cargo xtask ci

  cross-language:
    name: Cross-language hash parity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: packages/canonical/package-lock.json
      - name: Prove Rust and TypeScript produce identical hashes
        run: cargo xtask cross-language

  prober-acceptance:
    name: Real-prober acceptance (FS-004)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A fixture a real prober does not recognize proves nothing, and two of
      # the signature writers here were undetectable until their checksums were
      # reproduced. This was manual until now -- someone ran `blkid`, read the
      # output, and wrote a table into a document. Both tools are read-only and
      # are given regular files, never a device, so this stays unprivileged.
      - name: Record the prober versions this run measured
        run: blkid --version; wipefs --version
      - name: Re-probe every fixture and compare against the recorded output
        run: cargo xtask probe

# `Fuzz smoke` and `Supply-chain policy` used to live here. They now have their
# own workflows, because a `paths` filter applies to a whole workflow file and
# they are the two jobs whose answer depends on what changed rather than on
# every change. See `fuzz.yml` and `supply-chain.yml`.

