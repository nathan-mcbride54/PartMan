name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  tier-1:
    name: Tier 1 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so `verify-change-ownership` below can reach the merge
          # base. A shallow clone has no merge base to diff against, and the
          # check would have to be skipped -- which for an ownership gate means
          # passing vacuously.
          fetch-depth: 0
      # Dependency builds only. The key is the lockfile and the pinned
      # toolchain, so what is restored is exactly what `Cargo.lock` already
      # freezes: a change to either misses and rebuilds. First-party artifacts
      # are stripped in the last step of this job, before the cache is written,
      # so `partman-*` and `xtask` compile from source on every run and this
      # gate still proves that the tree under review builds and tests cleanly.
      #
      # That distinction is the whole reason this is scoped the way it is.
      # Caching `target/` wholesale would be faster still and would end the
      # from-scratch property on all three operating systems, which is not a
      # trade a gate should make quietly. Measured before choosing: on
      # `windows-2025` the fetch/index phase is 3s and the compile phase 61s,
      # so caching dependency *sources* alone would have bought nothing.
      - name: Restore the pinned dependency build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: tier1-deps-${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Run the unprivileged Tier-1 gate
        run: cargo xtask ci
      # Section 1.10: a change belongs to the work package its commits declare.
      # Added as a *step* inside this job on purpose -- a new job would need a
      # new required-status-check name, and renaming or adding required checks
      # without updating branch protection in the same change leaves every pull
      # request waiting forever on something that never reports.
      #
      # Linux only, because the answer cannot differ by operating system and
      # three identical verdicts are three chances for one to flake. Pull
      # requests only, because a push to `main` has no proposal to judge.
      - name: Verify the change belongs to its work package
        if: matrix.os == 'ubuntu-24.04' && github.event_name == 'pull_request'
        run: cargo xtask verify-change-ownership --base origin/${{ github.base_ref }}
      # Runs before `actions/cache` writes its entry, because a post-step runs
      # after every ordinary step. `if: always()` so a failing gate cannot leave
      # first-party artifacts behind to be restored into the next run.
      #
      # The member list comes from `cargo metadata`, not a literal, so a crate
      # added later is stripped without anyone remembering to edit this. If that
      # command fails the step fails, which is the safe direction: no cache entry
      # is better than one whose contents were never checked.
      - name: Drop first-party artifacts before the cache is written
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          members=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import sys,json;print(' '.join(p['name'].replace('-','_') for p in json.load(sys.stdin)['packages']))")
          echo "stripping: $members"
          rm -rf target/debug/incremental
          for member in $members; do
            rm -rf target/debug/.fingerprint/"$member"-* || true
            rm -rf target/debug/build/"$member"-*       || true
            rm -f  target/debug/deps/*"$member"-*       || true
            rm -f  target/debug/"$member"               || true
            rm -f  target/debug/"$member".exe           || true
          done
          echo "cache payload: $(du -sh target 2>/dev/null | cut -f1) in target/"

  # Ran on Linux alone while runner minutes were metered against a private
  # repository, where Windows bills 2x and macOS 10x. On a public repository
  # standard runners are unmetered, and this job is genuinely OS-sensitive: it
  # is the MODEL-005 proof that two languages hash identically, and the ways it
  # could stop being true -- CRLF translation of the shared vector file, path
  # handling, a platform-specific Node build -- are exactly the ones a
  # Linux-only run cannot see.
  cross-language:
    name: Cross-language hash parity / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: packages/canonical/package-lock.json
      - name: Prove Rust and TypeScript produce identical hashes
        run: cargo xtask cross-language

  # Stays Linux-only, and not for cost. `blkid` and `wipefs` are util-linux
  # programs: Windows has no equivalent and macOS ships none, so there is no
  # second prober for this job to disagree with. Widening it would produce two
  # skipped jobs wearing a passing check mark.
  prober-acceptance:
    name: Real-prober acceptance (FS-004)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A fixture a real prober does not recognize proves nothing, and two of
      # the signature writers here were undetectable until their checksums were
      # reproduced. This was manual until now -- someone ran `blkid`, read the
      # output, and wrote a table into a document. Both tools are read-only and
      # are given regular files, never a device, so this stays unprivileged.
      - name: Record the prober versions this run measured
        run: blkid --version; wipefs --version
      - name: Re-probe every fixture and compare against the recorded output
        run: cargo xtask probe

  # Stays Linux-only. cargo-fuzz has no supported Windows target, and the code
  # under test is the `pce/1` decoder -- byte-oriented, endian-independent, no
  # platform API -- so a macOS run would explore the same state space more
  # slowly rather than a different one. The useful axis here is time, not
  # operating system: 60s is a smoke run sized for a pull request, and a deep
  # scheduled run is the thing that would actually find more.
  fuzz-smoke:
    name: Fuzz smoke (Section 11.4)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-fuzz needs nightly for libFuzzer. The date is pinned for the same
      # reason rust-toolchain.toml pins a version: an unpinned nightly changes
      # under CI without a commit. Must match FUZZ_TOOLCHAIN in tools/xtask.
      - name: Install the pinned fuzzing toolchain
        run: rustup toolchain install nightly-2026-07-01 --profile minimal
      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Smoke-fuzz the parsers
        run: cargo xtask fuzz --seconds 60
      # A crash leaves a reproducer in fuzz/artifacts/. Binary fixtures are
      # never committed (Section 11.3), so it is uploaded for triage instead.
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # Also widened now that runners are unmetered. cargo-deny and cargo-audit
  # resolve a dependency graph, and that graph is per-target: the moment WP-040
  # and the platform helpers introduce `windows-sys`, `core-foundation`, or any
  # other cfg-gated dependency, a Linux-only run would be blind to advisories
  # and license violations reachable only from Windows or macOS. Widening it
  # before those dependencies land means the coverage is already in place when
  # they do, rather than being remembered afterwards.
  supply-chain:
    name: Supply-chain policy / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `cargo install` rebuilds both tools from source on every run, and at
      # these pinned versions that is byte-for-byte the same work every time.
      # On `windows-2025` it took 11m33s of a 12m00s gate, which made this job
      # the critical path of every pull request while the policy check it
      # exists to run finishes in seconds. The key names both exact versions
      # and the runner image, so a version bump or an image change misses and
      # rebuilds: nothing here can serve a binary for a version the workflow
      # no longer asks for.
      #
      # What is restored is a build of the pinned tool, never the policy input.
      # `deny.toml`, the locked dependency graph, and the advisory database
      # cargo-audit fetches at run time are all still read fresh by the step
      # below, so a stale entry cannot hide a new advisory. A pull request that
      # poisoned this entry would reach only its own branch's cache scope,
      # which is code it already controls.
      - name: Restore the pinned policy tools
        id: policy-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-deny.exe
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-audit.exe
          key: policy-tools-${{ matrix.os }}-${{ runner.arch }}-deny-0.19.4-audit-0.22.2
      - name: Install pinned policy tools
        if: steps.policy-tools.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-deny --version 0.19.4 --locked
          cargo install cargo-audit --version 0.22.2 --locked
      - name: Enforce advisory, license, and source policy
        run: cargo xtask supply-chain

