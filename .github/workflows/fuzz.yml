name: Fuzz

# Split out of `ci.yml` so it runs when a parser changes, which is what
# Section 11.4 actually asks for: short smoke runs gate every pull request
# *touching a parser*, and long runs are scheduled separately.
#
# The `paths` filter below is that rule, written down. It covers the canonical
# codec in both languages and the fuzz harness itself. It deliberately does not
# cover `crates/fixtures`, which writes bytes but parses none.
#
# The weekly schedule is not decoration. A fixed 60-second smoke run explores a
# different slice of the input space each time it starts from a new seed corpus
# state, so running it against unchanged code still buys coverage — and it is
# the only thing that would catch a decoder defect in a week where nobody
# touched the decoder.
on:
  pull_request:
    paths:
      - 'crates/domain/**'
      - 'packages/canonical/**'
      - 'fuzz/**'
      - 'schemas/**'
      - '.github/workflows/fuzz.yml'
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz-smoke:
    name: Fuzz smoke (Section 11.4)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-fuzz needs nightly for libFuzzer. The date is pinned for the same
      # reason rust-toolchain.toml pins a version: an unpinned nightly changes
      # under CI without a commit. Must match FUZZ_TOOLCHAIN in tools/xtask.
      - name: Install the pinned fuzzing toolchain
        run: rustup toolchain install nightly-2026-07-01 --profile minimal
      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Smoke-fuzz the parsers
        run: cargo xtask fuzz --seconds 60
      # A crash leaves a reproducer in fuzz/artifacts/. Binary fixtures are
      # never committed (Section 11.3), so it is uploaded for triage instead.
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
