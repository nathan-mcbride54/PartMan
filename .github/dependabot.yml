version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # The canonical codec is on the plan-authorization path, so its dependency
  # updates get the same weekly review as the Rust ones.
  - package-ecosystem: npm
    directory: /packages/canonical
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # The fuzz crate is excluded from the workspace, so the root Cargo entry
  # above never updates its graph. Its lockfile is committed and gated
  # (2026-07-29 audit); without this entry it would also never be updated.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

