[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  # Also the arm by which `Unlicense OR MIT` is admitted. `winapi-util`, the
  # safe `GetFileInformationByHandle` wrapper the SAFE-007 interlock reads its
  # link count through, carries that expression; cargo-deny satisfies it via
  # MIT and **Unlicense is deliberately not on this list**. Recorded because
  # the election is silent — the tool prints `licenses ok` either way — and
  # SEC-005's per-release inventory has no other source for which arm was
  # taken. Adding "Unlicense" here would be a permanent loosening bought for
  # nothing, since nothing is blocked.
  "MIT",
  "MPL-2.0",
  # University of Illinois/NCSA: permissive, BSD-3-Clause-shaped, OSI-approved.
  # Required because `libfuzzer-sys` is `(MIT OR Apache-2.0) AND NCSA` — the
  # AND makes it mandatory, not electable — and the fuzz graph is checked
  # against this same policy now that it is checked at all (2026-07-29 audit).
  "NCSA",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

# The allow-list above governs third-party dependencies and this project's own
# crates alike. The exemption that used to live here -- skipping `publish =
# false` crates because the project carried no `license` key -- is gone: every
# workspace member now declares `MIT OR Apache-2.0` (ADR-0006), so the gate
# checks them too. Leave this `false`. Setting it back to `true` would let a
# workspace crate lose its license key without failing CI, which is the exact
# drift SEC-005's per-release license inventory has to rule out.
private = { ignore = false }

# The Rust allow-list cannot see a C library reached through FFI: a `-sys` crate
# declares its own license, not that of the system library it links. ADR-0006
# forbids linking GPL libraries (libparted in particular) precisely because
# nothing here would catch it. External storage tools are invoked as separate
# processes under SAFE-004, which carries no such obligation.

[bans]
multiple-versions = "warn"
wildcards = "deny"

# A path dependency between two crates in this workspace carries no version
# requirement, which the wildcard check reports as `*`. That check exists to stop
# a registry dependency floating to whatever was published most recently; a path
# dependency resolves to a sibling directory in this repository and cannot float
# at all. Narrowing the exemption to path dependencies keeps a genuine
# `foo = "*"` from crates.io denied.
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
