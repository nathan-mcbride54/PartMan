[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

# The allow-list above governs third-party dependencies and is unchanged.
#
# This project's own crates carry no `license` key while it is unlicensed
# (Cargo.toml, README.md), which cargo-deny reports as `error[unlicensed]`.
# Skipping crates marked `publish = false` scopes that exemption to exactly the
# workspace members and never to a dependency. Set this back to `false` when the
# project adopts a license.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
