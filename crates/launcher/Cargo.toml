# The one SAFE-004 launch mechanism, moved out of `apps/cli` by the
# launcher-home round (docs/reviews/LINUX_LAUNCHER_HOME_ROUND_2026-08-20.md,
# option A) so the privileged helper can depend on it without depending on
# an app.
#
# No `[dependencies]` section, and that is load-bearing twice over: a
# mechanism must not import policy, and `apps/cli`'s dependency-closure
# guard asserts this crate's own closure is empty so the CLI's shipped
# closure stays hash-free and plan-free transitively.
[package]
name = "partman-launcher"
description = "The SAFE-004 launch mechanism: compiled absolute path, structured argv, sanitized environment, caller-stated output bound and deadline"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true
