[package]
name = "partman-journal"
description = "The WP-070 journal core: append-only checksummed frames with monotonic sequence numbers, torn-tail recovery, the JRN-002 durability seam as a typed boundary, idempotent replay, and three-way gap classification"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
# Exactly the two the assignment names, arriving with increment 3's
# record vocabulary as increment 2's manifest recorded they would:
# the statemachine for Section 8's vocabulary (states, transitions,
# effects), and the domain crate for the MODEL-005 `pce/1` codec the
# JRN-006 record schemas encode through — consumed, never re-derived.
partman-statemachine = { path = "../statemachine" }
partman-domain = { path = "../domain" }

[lints]
workspace = true
