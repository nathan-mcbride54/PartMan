[package]
name = "partman-ffi-linux-loop"
description = "Descriptor-bound Linux loop-device acceptance boundary"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
partman-fixtures = { path = "../fixtures" }
sha2 = { version = "0.11.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
linux-raw-sys = { version = "0.12.1", default-features = false, features = ["general", "ioctl", "loop_device", "std"] }
rustix = { version = "1.1.4", features = ["fs"] }

[lints]
workspace = true
