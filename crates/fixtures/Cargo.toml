[package]
name = "partman-fixtures"
description = "Deterministic synthetic disk images and the SAFE-007 disposable-target interlock"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
sha2 = { version = "0.11.0", default-features = false }

# `O_NOFOLLOW` for the SAFE-007 target open. Constants only — no `unsafe` is
# written here, and `unsafe_code = "deny"` still applies to this crate.
#
# The value differs per platform (Linux, macOS and the BSDs disagree), so
# hardcoding it is the kind of transcription error this repository has already
# been bitten by. Already in the lock file via `sha2` -> `cpufeatures`, so this
# adds an edge rather than supply-chain surface, and it is `MIT OR Apache-2.0`.
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false }
rustix = { version = "1.1.4", features = ["fs"] }

# `GetFileInformationByHandle` for the SAFE-007 other-name refusal, read through
# the already-authorized handle. Stable Rust exposes `number_of_links`,
# `file_index` and `volume_serial_number` only behind the unstable
# `windows_by_handle` feature (rust-lang/rust#63010, re-checked against the
# pinned 1.96.0), so the choice is a safe wrapper or FFI. SAFE-009 forbids
# `unsafe` in this crate and names the wrapper route, so `unsafe_code = "deny"`
# still applies here and no exception is needed.
#
# `winapi-util/src/file.rs` was read in full for this change rather than taken
# on reputation: it zeroes an all-integer `#[repr(C)]` structure, passes it as
# the out-parameter, and checks the return code before reading a field.
#
# One new lock entry. Three crates newly *compiled* on Windows, though:
# `windows-sys` and `windows-link` reach the lock only through `rustix`, which
# is `cfg(unix)`-gated, so this workspace currently builds no windows crate on a
# Windows target. See the confinement note in `interlock.rs`.
[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"

[lints]
workspace = true
