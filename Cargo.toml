[workspace]
members = [
    "apps/cli",
    "crates/adapter-linux",
    "crates/artifact-store",
    "crates/capability",
    "crates/domain",
    "crates/ffi-linux-loop",
    "crates/fixtures",
    "crates/journal",
    "crates/launcher",
    "crates/planner",
    "crates/rpc",
    "crates/statemachine",
    "crates/table-parser",
    "crates/tokens",
    "crates/transport-linux",
    "services/helper-linux",
    "tools/slint-feasibility",
    "tools/xtask",
]
# `fuzz` needs a nightly toolchain for libFuzzer, while this workspace is pinned
# to one stable release. Excluding it keeps `cargo xtask ci` from attempting to
# build it on stable. See docs/quality/fuzzing.md.
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
version = "0.0.0"
# Dual-licensed at the recipient's choice; see ADR-0006, LICENSE-MIT, and
# LICENSE-APACHE. Both arms are already on `deny.toml`'s allow-list, so this
# project's own crates are checked by the same gate as every dependency --
# `[licenses.private]` no longer exempts them.
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
