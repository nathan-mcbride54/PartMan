[workspace]
members = ["crates/domain", "tools/xtask"]
# `fuzz` needs a nightly toolchain for libFuzzer, while this workspace is pinned
# to one stable release. Excluding it keeps `cargo xtask ci` from attempting to
# build it on stable. See docs/quality/fuzzing.md.
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
version = "0.0.0"

# No `license` key: the project is deliberately unlicensed until it is complete
# (see README.md). Every crate sets `publish = false`, so Cargo does not require
# one. Restoring a license means adding it here, adding the license files, and
# relaxing `[licenses.private]` in deny.toml.

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"

