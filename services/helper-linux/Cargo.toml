[package]
name = "partman-helper-linux"
description = "The WP-L110 Linux privileged helper: reached over the Linux transport, HLP-001's six operations and nothing else, launched per user through pkexec (increment 3: ADR-0021's authorization ladder)"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "partman-helper-linux"
path = "src/main.rs"

[dependencies]
partman-domain = { path = "../../crates/domain" }
partman-rpc = { path = "../../crates/rpc" }
partman-transport-linux = { path = "../../crates/transport-linux" }
partman-adapter-linux = { path = "../../crates/adapter-linux" }
# Increment 2: the byte layer's classifier, the planner run over the
# helper's own capture, and the capability engine's facts vocabulary --
# each a workspace member, nothing re-implemented (HLP-002, ADR-0014).
partman-table-parser = { path = "../../crates/table-parser" }
partman-planner = { path = "../../crates/planner" }
partman-capability = { path = "../../crates/capability" }
# Increment 3: the journal's authorization-act record and its tier
# vocabulary (ADR-0021, ADR-0028). Increment 4a opens the journal: the
# on-disk home, the first real DurabilitySeam, and the transition
# records the lifecycle stands on.
partman-journal = { path = "../../crates/journal" }
# Increment 4a: the Section 8 transition vocabulary the journal records
# name — the state machine drives the apply to the authorization
# boundary (consumed, never re-implemented).
partman-statemachine = { path = "../../crates/statemachine" }

[target.'cfg(target_os = "linux")'.dependencies]
# The helper's own effective uid (the endpoint owner check) and nothing else
# from rustix; the transport already carries it.
rustix = { version = "1.1.4", default-features = false, features = ["process", "std"] }

[dev-dependencies]
# The Tier-1 suite classifies the catalogue's own images, built in memory
# from source, so the fixtures' evidence claims and the capture's answers
# can never drift apart silently (the table-parser suite's precedent).
partman-fixtures = { path = "../../crates/fixtures" }

[lints]
workspace = true
