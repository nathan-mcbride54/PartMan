[package]
name = "xtask"
description = "Safe repository task runner for PartMan"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
# The fixture generator and the SAFE-007 interlock. Depending on the library
# rather than shelling out keeps the interlock's decision inside one process, so
# there is no gap between "authorized" and "ran".
partman-fixtures = { path = "../../crates/fixtures" }
# The WP-030 accessibility harness. Same reasoning as above: depending on the
# library rather than shelling out keeps the audit's verdict inside one process.
partman-tokens = { path = "../../crates/tokens" }

[lints]
workspace = true

