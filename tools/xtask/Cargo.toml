[package]
name = "xtask"
description = "Safe repository task runner for PartMan"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
# The fixture generator and the SAFE-007 interlock. Depending on the library
# rather than shelling out keeps the interlock's decision inside one process, so
# there is no gap between "authorized" and "ran".
partman-fixtures = { path = "../../crates/fixtures" }
# The one registered Tier-2 acceptance consumes the SAFE-007 Authorization
# directly. Keeping this as an in-process dependency makes it impossible for
# xtask to turn the verified backing handles back into raceable path strings.
partman-ffi-linux-loop = { path = "../../crates/ffi-linux-loop" }
# The WP-030 accessibility harness. Same reasoning as above: depending on the
# library rather than shelling out keeps the audit's verdict inside one process.
partman-tokens = { path = "../../crates/tokens" }
# Reading `package.json` and `cargo metadata` output structurally. The licence
# gate used to match trimmed lines, which the 2026-07-29 follow-up audit
# defeated by nesting the property under `metadata` — a lexical check cannot
# know a JSON document's shape. Already in the lock file via `partman-tokens`.
serde_json = "1.0"
# The SI-35 instrument digests its own binary, the kernel config, and the
# udev ruleset for the environment record. Already in the lock via sha2 users.
sha2 = { version = "0.11.0", default-features = false }
yaml-rust2 = "0.11.0"

[lints]
workspace = true
